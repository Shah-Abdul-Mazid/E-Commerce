services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PROJECT_NAME=EZOPY MART TECH
      - APP_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5174
    env_file:
      - .env
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend_data:
